<!DOCTYPE html>
<html lang="pt-PT" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarefas Alexya Kids</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #212529;
            --text-muted: #6c757d;
            --border-color: #dee2e6;
            --primary-color: #ff6b35;
            --primary-hover: #e85a24;
            --shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #333333;
            --primary-color: #ff7f50;
            --primary-hover: #ff6347;
            --shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
        }

        .theme-btn, .settings-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .form-card, .kanban-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 10px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--card-bg);
            color: var(--text-color);
            box-sizing: border-box;
            font-size: 0.9rem;
        }

        button.primary {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
        }

        button.primary:hover {
            background: var(--primary-hover);
        }

        .kanban-board {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 15px;
        }

        .kanban-col {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            min-height: 300px;
        }

        .kanban-col h3 {
            font-size: 1rem;
            margin-top: 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .task-card {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            position: relative;
        }

        .task-card.alert-due {
            border-left: 4px solid #ff4d4d;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-right: 5px;
            background: var(--border-color);
        }

        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }

        .btn-small {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 3px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .btn-small:hover {
            color: var(--text-color);
            border-color: var(--text-color);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            border: 1px solid var(--border-color);
        }

        .category-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Tarefas Alexya Kids</h1>
        <div style="display: flex; gap: 8px;">
            <button class="settings-btn" onclick="openCatModal()">Gerir Categorias</button>
            <button class="theme-btn" onclick="toggleTheme()">🌓 Tema</button>
        </div>
    </header>

    <!-- Formulário de Nova Tarefa -->
    <div class="form-card">
        <div class="form-row">
            <input type="text" id="taskTitle" placeholder="O que precisa ser feito?">
            <select id="taskCategory"></select>
            <select id="taskPriority">
                <option value="Baixa">Prioridade baixa</option>
                <option value="Média" selected>Prioridade média</option>
                <option value="Alta">Prioridade alta</option>
            </select>
        </div>
        <div class="form-row" style="margin-top: 10px;">
            <div>
                <label style="font-size: 0.75rem; color: var(--text-muted);">Início:</label>
                <input type="date" id="taskStartDate">
            </div>
            <div>
                <label style="font-size: 0.75rem; color: var(--text-muted);">Fim (Prazo Limite):</label>
                <input type="date" id="taskEndDate">
            </div>
        </div>
        <textarea id="taskNotes" placeholder="Notas (opcional)" style="margin-top: 10px; height: 60px;"></textarea>
        <button class="primary" onclick="addTask()" style="margin-top: 10px;">Adicionar tarefa</button>
    </div>

    <!-- Quadro Kanban -->
    <div class="kanban-board">
        <div class="kanban-col" id="col-fazer">
            <h3>A fazer <span id="count-fazer" class="badge">0</span></h3>
            <div class="tasks-container" data-status="A fazer"></div>
        </div>
        <div class="kanban-col" id="col-andamento">
            <h3>Em andamento <span id="count-andamento" class="badge">0</span></h3>
            <div class="tasks-container" data-status="Em andamento"></div>
        </div>
        <div class="kanban-col" id="col-concluido">
            <h3>Concluído <span id="count-concluido" class="badge">0</span></h3>
            <div class="tasks-container" data-status="Concluído"></div>
        </div>
    </div>
</div>

<!-- Modal de Gestão de Categorias -->
<div class="modal" id="catModal">
    <div class="modal-content">
        <h3>Gerir Categorias</h3>
        <div style="display: flex; gap: 5px; margin-bottom: 15px;">
            <input type="text" id="newCatName" placeholder="Nova categoria...">
            <button class="primary" onclick="addCategory()" style="width: auto; padding: 0 15px;">Adicionar</button>
        </div>
        <div id="categoryListContainer"></div>
        <button class="btn-small" onclick="closeCatModal()" style="width: 100%; margin-top: 15px; padding: 8px;">Fechar</button>
    </div>
</div>

<script>
    let categories = JSON.parse(localStorage.getItem('alexya_categories')) || ["Fotos/Conteúdo", "Pedidos", "Estoque", "Financeiro", "Marketing"];
    let tasks = JSON.parse(localStorage.getItem('alexya_tasks')) || [];

    function saveToStorage() {
        localStorage.setItem('alexya_categories', JSON.stringify(categories));
        localStorage.setItem('alexya_tasks', JSON.stringify(tasks));
    }

    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('alexya_theme', newTheme);
    }

    // Carregar tema salvo
    const savedTheme = localStorage.getItem('alexya_theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);

    function updateCategoryDropdowns() {
        const select = document.getElementById('taskCategory');
        select.innerHTML = '';
        categories.forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat;
            opt.textContent = cat;
            select.appendChild(opt);
        });
    }

    function renderTasks() {
        const containerFazer = document.querySelector('#col-fazer .tasks-container');
        const containerAndamento = document.querySelector('#col-andamento .tasks-container');
        const containerConcluido = document.querySelector('#col-concluido .tasks-container');

        containerFazer.innerHTML = '';
        containerAndamento.innerHTML = '';
        containerConcluido.innerHTML = '';

        let counts = { "A fazer": 0, "Em andamento": 0, "Concluído": 0 };
        const today = new Date().toISOString().split('T')[0];

        tasks.forEach((task, index) => {
            counts[task.status]++;
            
            // Verificar proximidade da data limite (2 dias ou menos)
            let isCloseToDeadline = false;
            if(task.endDate && task.status !== 'Concluído') {
                const diffTime = new Date(task.endDate) - new Date(today);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                if(diffDays <= 2) isCloseToDeadline = true;
            }

            const card = document.createElement('div');
            card.className = `task-card ${isCloseToDeadline ? 'alert-due' : ''}`;
            card.innerHTML = `
                <strong>${task.title}</strong>
                ${task.notes ? `<p style="font-size:0.8rem; color:var(--text-muted); margin: 5px 0;">${task.notes}</p>` : ''}
                <div style="margin-top: 8px;">
                    <span class="badge">${task.category}</span>
                    <span class="badge">${task.priority}</span>
                    <span style="font-size:0.75rem; color:var(--text-muted);">📅 ${task.startDate || '--'} até ${task.endDate || '--'}</span>
                </div>
                <div class="actions-bar">
                    <select onchange="changeStatus(${index}, this.value)" style="font-size:0.75rem; padding:3px; width:auto;">
                        <option value="A fazer" ${task.status === 'A fazer' ? 'selected' : ''}>A fazer</option>
                        <option value="Em andamento" ${task.status === 'Em andamento' ? 'selected' : ''}>Em andamento</option>
                        <option value="Concluído" ${task.status === 'Concluído' ? 'selected' : ''}>Concluído</option>
                    </select>
                    <button class="btn-small" onclick="deleteTask(${index})">Excluir</button>
                </div>
            `;

            if(task.status === 'A fazer') containerFazer.appendChild(card);
            else if(task.status === 'Em andamento') containerAndamento.appendChild(card);
            else containerConcluido.appendChild(card);
        });

        document.getElementById('count-fazer').textContent = counts["A fazer"];
        document.getElementById('count-andamento').textContent = counts["Em andamento"];
        document.getElementById('count-concluido').textContent = counts["Concluído"];
    }

    function addTask() {
        const title = document.getElementById('taskTitle').value.trim();
        if(!title) return alert('Por favor, digite o título da tarefa.');

        const newTask = {
            title: title,
            category: document.getElementById('taskCategory').value,
            priority: document.getElementById('taskPriority').value,
            startDate: document.getElementById('taskStartDate').value,
            endDate: document.getElementById('taskEndDate').value,
            notes: document.getElementById('taskNotes').value.trim(),
            status: 'A fazer'
        };

        tasks.push(newTask);
        saveToStorage();
        renderTasks();

        document.getElementById('taskTitle').value = '';
        document.getElementById('taskNotes').value = '';
        document.getElementById('taskStartDate').value = '';
        document.getElementById('taskEndDate').value = '';
    }

    function changeStatus(index, newStatus) {
        tasks[index].status = newStatus;
        saveToStorage();
        renderTasks();
    }

    function deleteTask(index) {
        if(confirm('Deseja excluir esta tarefa?')) {
            tasks.splice(index, 1);
            saveToStorage();
            renderTasks();
        }
    }

    // Modal de Categorias
    function openCatModal() {
        renderCategoryList();
        document.getElementById('catModal').style.display = 'flex';
    }

    function closeCatModal() {
        document.getElementById('catModal').style.display = 'none';
        updateCategoryDropdowns();
    }

    function renderCategoryList() {
        const container = document.getElementById('categoryListContainer');
        container.innerHTML = '';
        categories.forEach((cat, index) => {
            const row = document.createElement('div');
            row.className = 'category-list-item';
            row.innerHTML = `
                <input type="text" value="${cat}" id="cat-input-${index}" style="margin-right: 5px;">
                <button class="btn-small" onclick="renameCategory(${index})">Salvar</button>
                <button class="btn-small" onclick="deleteCategory(${index})" style="color: #ff4d4d; border-color: #ff4d4d;">X</button>
            `;
            container.appendChild(row);
        });
    }

    function addCategory() {
        const name = document.getElementById('newCatName').value.trim();
        if(name && !categories.includes(name)) {
            categories.push(name);
            document.getElementById('newCatName').value = '';
            saveToStorage();
            renderCategoryList();
        }
    }

    function renameCategory(index) {
        const newName = document.getElementById(`cat-input-${index}`).value.trim();
        if(newName) {
            const oldName = categories[index];
            categories[index] = newName;
            // Atualizar nas tarefas existentes
            tasks.forEach(t => { if(t.category === oldName) t.category = newName; });
            saveToStorage();
            renderCategoryList();
            renderTasks();
        }
    }

    function deleteCategory(index) {
        if(categories.length <= 1) return alert('Você precisa manter pelo menos uma categoria.');
        categories.splice(index, 1);
        saveToStorage();
        renderCategoryList();
    }

    // Inicialização
    updateCategoryDropdowns();
    renderTasks();
</script>

</body>
</html>
